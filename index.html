<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>牌譜プレーヤー — Muse雀荘 paipu viewer</title>
<style>
  :root { --felt:#14532d; --felt2:#166534; --deep:#052e16; --panel:#0f172a; --panel2:#1e293b; --ink:#e2e8f0; --dim:#94a3b8; --acc:#f472b6; --gold:#fbbf24; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; background:#010d05; color:var(--ink); }
  header { padding:10px 14px; background:var(--panel); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  header h1 { font-size:16px; margin:0 10px 0 0; }
  header .meta { color:var(--dim); font-size:12px; }
  button, select, input[type="file"] { font:inherit; }
  button { background:var(--panel2); color:var(--ink); border:1px solid #334155; border-radius:8px; padding:6px 10px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.primary { background:#7c2d12; border-color:var(--gold); }
  textarea { width:100%; min-height:70px; background:#0b1220; color:var(--ink); border:1px solid #334155; border-radius:8px; padding:8px; }
  .loader { padding:10px 14px; background:#0b1220; display:none; }
  .loader.open { display:block; }
  main { padding:12px; max-width:1100px; margin:0 auto; }
  /* 対局ステータス行（本家観戦ページ風） */
  .statusline { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; font-size:17px; font-weight:700; padding:2px 2px 10px; }
  .statusline .sep { color:var(--dim); font-weight:400; }
  .statusline .tile { font-size:38px; }
  /* 席ロースター（本家観戦ページ風） */
  .roster { display:grid; grid-template-columns:1fr 1fr; gap:8px; background:rgba(20,83,45,.5); border:1px solid rgba(74,222,128,.4); border-radius:14px; padding:10px; margin-bottom:12px; }
  .rcard { background:rgba(22,101,52,.75); border-radius:10px; padding:8px 12px; min-height:64px; }
  .rcard.turn { box-shadow:0 0 0 2px var(--gold); }
  .rcard .rwind { font-size:12px; color:#bbf7d0; }
  .rcard .rname { font-size:19px; font-weight:800; margin-top:1px; }
  .rcard .rscore { color:var(--gold); font-weight:700; font-variant-numeric:tabular-nums; font-size:14px; }
  .rcard .rtags { color:var(--acc); font-size:11px; min-height:13px; }
  /* 盤面：四辺に手牌ストリップ、内側に河と中央パネル */
  .board { background:radial-gradient(circle at 50% 45%, var(--felt2), var(--felt) 70%, var(--deep)); border-radius:16px; padding:10px; display:grid; gap:8px;
    grid-template-columns: auto 1fr auto; grid-template-rows: auto 1fr auto;
    grid-template-areas: "top top top" "left table right" "bottom bottom bottom"; }
  .hstrip { background:rgba(2,20,10,.55); border:1px solid rgba(148,163,184,.30); border-radius:12px; padding:6px 8px; display:flex; align-items:center; gap:8px; min-height:56px; }
  .hstrip.turn { border-color:var(--gold); box-shadow:0 0 0 2px rgba(251,191,36,.35); }
  .hstrip[data-pos="top"] { grid-area:top; }
  .hstrip[data-pos="bottom"] { grid-area:bottom; }
  .hstrip[data-pos="left"] { grid-area:left; flex-direction:column; align-items:stretch; }
  .hstrip[data-pos="right"] { grid-area:right; flex-direction:column; align-items:stretch; }
  .hlabel { display:flex; flex-direction:column; line-height:1.25; min-width:64px; }
  .hstrip[data-pos="left"] .hlabel, .hstrip[data-pos="right"] .hlabel { text-align:center; min-width:0; }
  .hlabel .wind { color:var(--gold); font-size:12px; font-weight:700; }
  .hlabel .name { font-weight:700; font-size:13px; white-space:nowrap; }
  .hlabel .score { color:#fde68a; font-variant-numeric:tabular-nums; font-size:13px; }
  .hlabel .tags { color:var(--acc); font-size:11px; min-height:13px; }
  .hand { display:flex; flex-wrap:nowrap; gap:2px; align-items:center; }
  .hstrip[data-pos="left"] .hand, .hstrip[data-pos="right"] .hand { flex-direction:column; flex-wrap:nowrap; }
  .melds { display:flex; gap:6px; }
  .hstrip[data-pos="left"] .melds, .hstrip[data-pos="right"] .melds { flex-direction:column; }
  .meld { display:flex; gap:1px; background:rgba(148,163,184,.12); padding:2px; border-radius:4px; }
  .hstrip[data-pos="left"] .meld, .hstrip[data-pos="right"] .meld { flex-direction:column; }
  /* 内側テーブル */
  .table { display:grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: 1fr auto 1fr; gap:6px; align-items:center; justify-items:center; min-height:340px; }
  .river-box { background:rgba(2,20,10,.38); border-radius:10px; padding:5px; min-width:150px; min-height:92px; display:flex; align-items:flex-start; justify-content:center; }
  .river-box[data-pos="top"] { grid-column:2; grid-row:1; }
  .river-box[data-pos="bottom"] { grid-column:2; grid-row:3; }
  .river-box[data-pos="left"] { grid-column:1; grid-row:2; }
  .river-box[data-pos="right"] { grid-column:3; grid-row:2; }
  .river-box.turn { box-shadow:inset 0 0 0 2px rgba(251,191,36,.45); }
  .river { display:grid; grid-template-columns:repeat(6, 25px); gap:2px; }
  .river-box[data-pos="left"] .river, .river-box[data-pos="right"] .river { grid-template-columns:repeat(4, 25px); }
  .center { grid-column:2; grid-row:2; position:relative; background:rgba(2,12,6,.78); border:1px solid rgba(74,222,128,.35); border-radius:12px; width:236px; height:168px; text-align:center; }
  .center .round { font-size:24px; font-weight:800; margin-top:38px; letter-spacing:.06em; }
  .center .sub { color:var(--dim); font-size:12px; margin-top:3px; }
  .center .dora { margin-top:5px; display:flex; gap:2px; justify-content:center; align-items:center; font-size:11px; color:var(--dim); }
  .cscore { position:absolute; font-size:12px; font-variant-numeric:tabular-nums; color:#fde68a; text-align:center; line-height:1.3; }
  .cscore .cw { display:block; color:var(--dim); font-size:11px; }
  .cscore.turn { color:var(--gold); font-weight:800; }
  .cscore[data-pos="top"] { top:6px; left:50%; transform:translateX(-50%); }
  .cscore[data-pos="bottom"] { bottom:6px; left:50%; transform:translateX(-50%); }
  .cscore[data-pos="left"] { left:8px; top:50%; transform:translateY(-50%); }
  .cscore[data-pos="right"] { right:8px; top:50%; transform:translateY(-50%); }
  /* 牌（自前 SVG 描画：OS フォントに頼らないカラー図柄） */
  .tile { display:inline-block; width:30px; height:40px; flex:none; filter:drop-shadow(0 1px 1px rgba(0,0,0,.45)); }
  .tile svg { display:block; width:100%; height:100%; }
  .tile.back { border-radius:4px; border:1px solid #450a0a;
    background:repeating-linear-gradient(45deg,#991b1b 0 4px,#7f1d1d 4px 8px); box-shadow:0 1px 2px rgba(0,0,0,.45); filter:none; }
  .tile.river { width:23px; height:31px; }
  .statusline .tile { width:27px; height:36px; }
  .rot90 { transform:rotate(90deg); } .rot180 { transform:rotate(180deg); } .rot270 { transform:rotate(-90deg); }
  .river-box[data-pos="left"] .tile, .river-box[data-pos="right"] .tile { margin:0 3px; }
  .controls { margin-top:12px; background:var(--panel); border-radius:12px; padding:10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .controls input[type="range"] { flex:1; min-width:160px; }
  .evinfo { font-variant-numeric:tabular-nums; color:var(--dim); font-size:13px; }
  .jumps { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  .jumps button { font-size:12px; padding:4px 8px; }
  .results { margin-top:12px; background:var(--panel); border-radius:12px; padding:10px; display:none; }
  .results.open { display:block; }
  .results table { border-collapse:collapse; }
  .results td, .results th { padding:3px 10px 3px 0; text-align:left; }
  .drop { border:2px dashed #334155; border-radius:12px; padding:16px; text-align:center; color:var(--dim); margin-bottom:12px; }
  .drop.over { border-color:var(--acc); color:var(--ink); }
  .err { color:#fca5a5; white-space:pre-wrap; font-size:13px; }
  @media (max-width: 680px) {
    main { padding:8px; }
    .board { padding:6px; gap:6px; }
    .statusline { font-size:14px; }
    .tile { width:20px; height:27px; }
    .tile.river { width:18px; height:24px; }
    .statusline .tile { width:20px; height:27px; }
    .table { grid-template-columns:64px 1fr 64px; min-height:0; gap:4px; }
    .river { grid-template-columns:repeat(6, 20px); }
    .river-box { min-width:0; min-height:76px; padding:3px; }
    .river-box[data-pos="left"] .river, .river-box[data-pos="right"] .river { grid-template-columns:repeat(3, 20px); }
    .center { width:100%; max-width:196px; height:150px; } .center .round { font-size:19px; margin-top:34px; }
    .hstrip { padding:5px 6px; }
    .hstrip[data-pos="top"], .hstrip[data-pos="bottom"] { flex-wrap:wrap; }
    .hand { gap:1px; }
    .hstrip[data-pos="left"] .tile, .hstrip[data-pos="right"] .tile { margin:1px 0; }
    .hlabel { min-width:40px; } .hlabel .name { font-size:11px; }
    .rcard .rname { font-size:16px; }
  }
</style>
</head>
<body>
<header>
  <h1>🀄 牌譜プレーヤー</h1>
  <button id="btn-file">ファイルを開く</button>
  <input type="file" id="file" accept=".ndjson,.json,.txt" hidden>
  <button id="btn-paste">貼り付け</button>
  <button id="btn-sample">サンプル</button>
  <button id="btn-webgpu" title="いま表示中の局面を WebGPU 版で開きます">WebGPU版で開く</button>
  <span class="meta" id="filemeta">Muse雀荘の牌譜（NDJSON, schema v1）を再生します</span>
</header>
<div class="loader" id="loader">
  <textarea id="paste" placeholder="NDJSON牌譜をここに貼り付け"></textarea>
  <div style="margin-top:6px"><button id="btn-load-paste" class="primary">読み込む</button></div>
  <div class="err" id="err"></div>
</div>
<main>
  <div class="drop" id="drop">牌譜ファイル（.ndjson）をドロップしても読み込めます</div>
  <div class="statusline" id="statusline">牌譜を読み込んでください</div>
  <section class="roster" id="roster"></section>
  <section class="board" id="board">
    <div class="hstrip" data-pos="top"></div>
    <div class="hstrip" data-pos="left"></div>
    <div class="table">
      <div class="river-box" data-pos="top"></div>
      <div class="river-box" data-pos="left"></div>
      <div class="center">
        <div class="cscore" data-pos="top"></div>
        <div class="cscore" data-pos="left"></div>
        <div class="round" id="c-round">—</div>
        <div class="sub" id="c-sub"></div>
        <div class="dora" id="c-dora"></div>
        <div class="cscore" data-pos="right"></div>
        <div class="cscore" data-pos="bottom"></div>
      </div>
      <div class="river-box" data-pos="right"></div>
      <div class="river-box" data-pos="bottom"></div>
    </div>
    <div class="hstrip" data-pos="right"></div>
    <div class="hstrip" data-pos="bottom"></div>
  </section>
  <section class="controls">
    <button id="btn-first">⏮</button>
    <button id="btn-prev">◀</button>
    <button id="btn-play" class="primary">▶ 再生</button>
    <button id="btn-next">▶|</button>
    <button id="btn-last">⏭</button>
    <input type="range" id="scrub" min="0" max="0" value="0">
    <select id="speed">
      <option value="1600">0.5x</option>
      <option value="900" selected>1x</option>
      <option value="450">2x</option>
      <option value="200">4x</option>
    </select>
    <select id="viewpoint">
      <option value="master">視点：全席オープン</option>
      <option value="0">視点：東家</option>
      <option value="1">視点：南家</option>
      <option value="2">視点：西家</option>
      <option value="3">視点：北家</option>
    </select>
    <span class="evinfo" id="evinfo"></span>
  </section>
  <div class="jumps" id="jumps"></div>
  <section class="results" id="results"></section>
</main>
<script>
"use strict";
// 牌の数値表現（サーバーのエンジンと同じ）：0-8 萬子, 9-17 筒子, 18-26 索子, 27-33 字牌
const NUM = ["一","二","三","四","五","六","七","八","九"];
const SUIT = ["萬","筒","索"];
const HONOR = ["東","南","西","北","白","發","中"];
const WIND = ["東","南","西","北"];
const ROT = { bottom: "", right: " rot270", top: " rot180", left: " rot90" };
function tileLabel(t){
  if (typeof t !== "number" || t < 0 || t > 33) return "?";
  if (t <= 26) return NUM[t % 9] + SUIT[Math.floor(t / 9)];
  return HONOR[t - 27];
}
function tileVal(x){ // 捨て牌などは数値か {tile:n} のどちらか
  if (typeof x === "number") return x;
  if (x && typeof x === "object" && typeof x.tile === "number") return x.tile;
  return -1;
}
// 牌フェイスの自前 SVG 描画（配置・色は WebGPU 版シェーダと共通の表）
const PIP_POS = {
  1: [[.5,.5]],
  2: [[.5,.29],[.5,.71]],
  3: [[.31,.27],[.5,.5],[.69,.73]],
  4: [[.31,.29],[.69,.29],[.31,.71],[.69,.71]],
  5: [[.31,.29],[.69,.29],[.5,.5],[.31,.71],[.69,.71]],
  6: [[.31,.24],[.69,.24],[.31,.5],[.69,.5],[.31,.76],[.69,.76]],
  7: [[.28,.15],[.5,.2],[.72,.25],[.31,.48],[.69,.48],[.31,.72],[.69,.72]],
  8: [[.31,.17],[.69,.17],[.31,.39],[.69,.39],[.31,.61],[.69,.61],[.31,.83],[.69,.83]],
  9: [[.27,.24],[.5,.24],[.73,.24],[.27,.5],[.5,.5],[.73,.5],[.27,.76],[.5,.76],[.73,.76]],
};
const PIP_COL = { // 0=青 1=緑 2=赤
  2: [0,1], 3: [0,1,2], 4: [0,1,1,0], 5: [0,1,2,1,0],
  6: [1,1,2,2,0,0], 7: [1,1,1,0,0,2,2], 8: [0,0,0,0,0,0,0,0], 9: [0,0,0,1,1,1,2,2,2],
};
const PCOL = ["#2456c8", "#189a46", "#d43a2f"];
const SERIF = '"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
function tileSVG(t){
  const body = '<rect x="0.75" y="0.75" width="28.5" height="38.5" rx="3.5" fill="#f8f5ec" stroke="#a8a294" stroke-width="1.5"/>' +
               '<rect x="2" y="34.5" width="26" height="3.5" rx="1.5" fill="#e3ddcb"/>';
  let face = "";
  const X = p => 3 + p[0] * 24, Y = p => 3 + p[1] * 34;
  if (t >= 0 && t <= 8){ // 萬子
    face = `<text x="15" y="16" text-anchor="middle" font-family='${SERIF}' font-weight="700" font-size="12.5" fill="#22304a">${NUM[t]}</text>` +
           `<text x="15" y="33.5" text-anchor="middle" font-family='${SERIF}' font-weight="700" font-size="13.5" fill="#b3271e">萬</text>`;
  } else if (t >= 9 && t <= 17){ // 筒子
    const n = t - 8;
    if (n === 1){
      face = '<circle cx="15" cy="20" r="10.5" fill="none" stroke="#189a46" stroke-width="2.6"/>' +
             '<circle cx="15" cy="20" r="7.4" fill="none" stroke="#2456c8" stroke-width="2.2"/>' +
             '<circle cx="15" cy="20" r="4.2" fill="#d43a2f"/>';
    } else {
      const R = n >= 6 ? 2.9 : 3.4;
      face = PIP_POS[n].map((p, i) => {
        const c = PCOL[PIP_COL[n][i]], cx = X(p), cy = Y(p);
        return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${c}"/><circle cx="${cx}" cy="${cy}" r="${(R*0.62).toFixed(2)}" fill="#f8f5ec"/><circle cx="${cx}" cy="${cy}" r="${(R*0.3).toFixed(2)}" fill="${c}"/>`;
      }).join("");
    }
  } else if (t >= 18 && t <= 26){ // 索子
    const n = t - 17;
    if (n === 1){
      face = '<circle cx="15" cy="20" r="9.5" fill="#189a46"/><circle cx="15" cy="20" r="6.2" fill="#e8a713"/><circle cx="15" cy="20" r="3.2" fill="#d43a2f"/>' +
             '<circle cx="7.5" cy="12" r="2.5" fill="#2456c8"/><circle cx="22.5" cy="12" r="2.5" fill="#2456c8"/>';
    } else {
      face = PIP_POS[n].map((p, i) => {
        let c = "#189a46";
        if (n === 2 && i === 0) c = "#2456c8";
        if (n === 5 && i === 2) c = "#d43a2f";
        const cx = X(p), cy = Y(p);
        return `<rect x="${(cx-1.7).toFixed(2)}" y="${(cy-4.6).toFixed(2)}" width="3.4" height="9.2" rx="1.7" fill="${c}"/><rect x="${(cx-1.7).toFixed(2)}" y="${(cy-0.45).toFixed(2)}" width="3.4" height="0.9" fill="#0b5c2c"/>`;
      }).join("");
    }
  } else if (t >= 27){ // 字牌
    if (t === 31){ // 白：青枠
      face = '<rect x="7.5" y="10" width="15" height="20" fill="none" stroke="#2456c8" stroke-width="1.8"/>';
    } else {
      const col = t === 32 ? "#189a46" : t === 33 ? "#d43a2f" : "#22304a";
      face = `<text x="15" y="28" text-anchor="middle" font-family='${SERIF}' font-weight="700" font-size="16" fill="${col}">${HONOR[t-27]}</text>`;
    }
  }
  return `<svg viewBox="0 0 30 40" xmlns="http://www.w3.org/2000/svg">${body}${face}</svg>`;
}
function tileEl(t, cls){
  const s = document.createElement("span");
  s.className = "tile" + (cls ? " " + cls : "");
  s.innerHTML = tileSVG(t);
  s.title = tileLabel(t);
  return s;
}
function backEl(cls){ const s = document.createElement("span"); s.className = "tile back" + (cls ? " " + cls : ""); s.title = "裏向きの牌"; return s; }

let paipu = null;   // {header, events:[{seq,revision,kind,state}], footer}
let idx = 0;
let timer = null;

function roundLabel(st){
  if (!st) return "—";
  if (typeof st.round_label === "string" && st.round_label) return st.round_label;
  if (typeof st.round === "string") return st.round;
  if (st.round && typeof st.round === "object"){
    if (typeof st.round.label === "string") return st.round.label;
    return (st.round.wind ?? "?") + (st.round.number ?? "?") + "局";
  }
  if (st.round_wind !== undefined && st.hand_index !== undefined)
    return st.round_wind + (Number(st.hand_index) + 1) + "局";
  return "—";
}
function riichiSeats(st){
  const r = st.riichi;
  if (Array.isArray(r)){
    if (r.every(v => typeof v === "boolean")) return r.map((v,i)=>v?i:-1).filter(i=>i>=0);
    return r.filter(v => typeof v === "number");
  }
  if (typeof r === "number") return [r];
  return [];
}
function seatName(seat, st){
  const occ = st && st.occupancy;
  if (Array.isArray(occ) && occ[seat]){
    const o = occ[seat];
    if (typeof o === "object" && o.display_name) return String(o.display_name);
  }
  if (paipu && paipu.footer && Array.isArray(paipu.footer.results)){
    const r = paipu.footer.results.find(x => x.seat === seat);
    if (r && r.display_name && r.display_name !== "sample") return String(r.display_name);
  }
  return WIND[seat] + "家";
}

function render(){
  const ev = paipu ? paipu.events[idx] : null;
  const st = ev ? ev.state : null;
  const vpSel = document.getElementById("viewpoint").value;
  const vp = vpSel === "master" ? null : Number(vpSel);
  const base = vp ?? 0;
  const posSeat = { bottom: base, right: (base + 1) % 4, top: (base + 2) % 4, left: (base + 3) % 4 };
  const riichi = st ? riichiSeats(st) : [];
  const dora = st ? (st.dora ?? st.dora_indicators ?? []) : [];

  // ステータス行（本家風：東4局 1本場 / 供託 0 / 山 残り68枚 / ドラ表示 [牌]）
  const sl = document.getElementById("statusline");
  sl.innerHTML = "";
  if (st){
    sl.append(document.createTextNode(`${roundLabel(st)} ${st.honba ?? 0}本場`));
    const sep = document.createElement("span"); sep.className = "sep"; sep.textContent = "/";
    sl.append(sep, document.createTextNode(`供託 ${st.kyotaku ?? 0}`));
    const sep2 = sep.cloneNode(); sep2.textContent = "/";
    sl.append(sep2, document.createTextNode(`山 残り${st.wall_count ?? "?"}枚`));
    if (dora.length){
      const sep3 = sep.cloneNode(); sep3.textContent = "/";
      sl.append(sep3, document.createTextNode("ドラ表示"));
      dora.map(tileVal).forEach(t => { if (t >= 0) sl.appendChild(tileEl(t)); });
    }
  } else {
    sl.textContent = "牌譜を読み込んでください";
  }

  // 中央パネル
  document.getElementById("c-round").textContent = st ? roundLabel(st) : "—";
  document.getElementById("c-sub").textContent = st
    ? `${st.honba ?? 0}本場 / 供託 ${st.kyotaku ?? 0}` : "";
  const cd = document.getElementById("c-dora");
  cd.innerHTML = "";
  if (st && dora.length){
    cd.append(document.createTextNode("ドラ表示"));
    dora.map(tileVal).forEach(t => { if (t >= 0) cd.appendChild(tileEl(t, "river")); });
  }
  for (const [pos, seat] of Object.entries(posSeat)){
    const cs = document.querySelector(`.cscore[data-pos="${pos}"]`);
    cs.innerHTML = "";
    cs.classList.toggle("turn", !!st && st.turn === seat);
    if (st){
      const w = document.createElement("span"); w.className = "cw"; w.textContent = WIND[seat] + "家";
      cs.append(w, document.createTextNode(Array.isArray(st.scores) ? Number(st.scores[seat]).toLocaleString() : ""));
    }
  }

  // ロースター（席順）
  const roster = document.getElementById("roster");
  roster.innerHTML = "";
  for (let seat = 0; seat < 4; seat++){
    const card = document.createElement("div");
    card.className = "rcard" + (st && st.turn === seat ? " turn" : "");
    const w = document.createElement("div"); w.className = "rwind"; w.textContent = WIND[seat] + "席";
    const nm = document.createElement("div"); nm.className = "rname"; nm.textContent = st ? seatName(seat, st) : "—";
    const sc = document.createElement("span"); sc.className = "rscore";
    sc.textContent = st && Array.isArray(st.scores) ? Number(st.scores[seat]).toLocaleString() + "点" : "";
    nm.append(" ", sc);
    const tg = document.createElement("div"); tg.className = "rtags";
    const tags = [];
    if (st && st.dealer === seat) tags.push("親");
    if (riichi.includes(seat)) tags.push("リーチ");
    if (st && st.turn === seat) tags.push("ツモ番");
    tg.textContent = tags.join(" ・ ");
    card.append(w, nm, tg);
    roster.append(card);
  }

  document.getElementById("evinfo").textContent = ev
    ? `#${idx + 1}/${paipu.events.length} seq=${ev.seq} rev=${ev.revision}` : "";
  document.getElementById("scrub").max = paipu ? String(paipu.events.length - 1) : "0";
  document.getElementById("scrub").value = String(idx);

  // 手牌ストリップと河
  for (const [pos, seat] of Object.entries(posSeat)){
    const rot = ROT[pos];
    const strip = document.querySelector(`.hstrip[data-pos="${pos}"]`);
    strip.innerHTML = "";
    strip.classList.toggle("turn", !!st && st.turn === seat);
    const label = document.createElement("div"); label.className = "hlabel";
    const w = document.createElement("span"); w.className = "wind"; w.textContent = WIND[seat] + "家";
    const nm = document.createElement("span"); nm.className = "name"; nm.textContent = st ? seatName(seat, st) : "—";
    const sc = document.createElement("span"); sc.className = "score";
    sc.textContent = st && Array.isArray(st.scores) ? Number(st.scores[seat]).toLocaleString() : "";
    const tg = document.createElement("span"); tg.className = "tags";
    if (riichi.includes(seat)) tg.textContent = "リーチ";
    label.append(w, nm, sc, tg);
    strip.append(label);
    const rbox = document.querySelector(`.river-box[data-pos="${pos}"]`);
    rbox.innerHTML = "";
    rbox.classList.toggle("turn", !!st && st.turn === seat);
    if (st){
      const hand = Array.isArray(st.hands) ? st.hands[seat] : null;
      const handDiv = document.createElement("div"); handDiv.className = "hand";
      const visible = vp === null || vp === seat;
      if (Array.isArray(hand)){
        const sorted = [...hand].sort((a,b) => tileVal(a) - tileVal(b));
        for (const t of sorted){
          const v = tileVal(t);
          handDiv.append(visible && v >= 0 ? tileEl(v, rot.trim()) : backEl(rot.trim()));
        }
      }
      strip.append(handDiv);
      const melds = Array.isArray(st.melds) ? st.melds[seat] : null;
      if (Array.isArray(melds) && melds.length){
        const md = document.createElement("div"); md.className = "melds";
        for (const m of melds){
          const g = document.createElement("span"); g.className = "meld";
          const tiles = Array.isArray(m) ? m : (m && Array.isArray(m.tiles) ? m.tiles : []);
          for (const t of tiles){ const v = tileVal(t); if (v >= 0) g.appendChild(tileEl(v, rot.trim())); }
          if (g.childNodes.length) md.append(g);
        }
        strip.append(md);
      }
      const river = Array.isArray(st.discards) ? st.discards[seat] : null;
      if (Array.isArray(river)){
        const rv = document.createElement("div"); rv.className = "river";
        for (const t of river){ const v = tileVal(t); if (v >= 0) rv.appendChild(tileEl(v, "river" + rot)); }
        rbox.append(rv);
      }
    }
  }
  // 結果
  const res = document.getElementById("results");
  if (paipu && paipu.footer && Array.isArray(paipu.footer.results) && paipu.footer.results.length){
    res.classList.add("open");
    const rows = [...paipu.footer.results].sort((a,b) => (a.rank||9) - (b.rank||9))
      .map(r => `<tr><td>${r.rank ? r.rank + "位" : ""}</td><td>${escapeHtml(String(r.display_name ?? ""))}</td><td>${WIND[r.seat] ?? ""}席</td><td>${Number(r.score).toLocaleString()}点</td></tr>`).join("");
    res.innerHTML = `<strong>最終結果</strong><table>${rows}</table>`;
  } else { res.classList.remove("open"); res.innerHTML = ""; }
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function buildJumps(){
  const j = document.getElementById("jumps"); j.innerHTML = "";
  if (!paipu) return;
  let last = null;
  paipu.events.forEach((ev, i) => {
    const label = roundLabel(ev.state);
    if (label !== last){
      last = label;
      const b = document.createElement("button");
      b.textContent = label;
      b.onclick = () => { stop(); idx = i; render(); };
      j.append(b);
    }
  });
}

function loadText(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
  if (lines.length < 2) throw new Error("行が足りません（ヘッダー＋イベント列が必要です）");
  const parsed = lines.map((l, i) => { try { return JSON.parse(l); } catch(e){ throw new Error(`${i + 1}行目がJSONではありません`); } });
  const header = parsed[0];
  if (header.type !== "paipu_header") throw new Error("1行目が paipu_header ではありません");
  if (header.schema_version !== 1) throw new Error("未対応の schema_version: " + header.schema_version);
  let footer = null;
  if (parsed[parsed.length - 1].type === "paipu_footer"){ footer = parsed.pop(); }
  const events = parsed.slice(1);
  for (const e of events) if (e.type !== "event" || !e.state) throw new Error("イベント行の形式が不正です");
  paipu = { header, events, footer };
  idx = 0; stop();
  document.getElementById("filemeta").textContent =
    `match_key=${header.match_key} / ${events.length}イベント / 完全=${header.complete ? "はい" : "いいえ"}`;
  buildJumps(); render();
}

function stop(){ if (timer){ clearInterval(timer); timer = null; document.getElementById("btn-play").textContent = "▶ 再生"; } }
function play(){
  if (!paipu) return;
  if (timer){ stop(); return; }
  document.getElementById("btn-play").textContent = "⏸ 停止";
  timer = setInterval(() => {
    if (idx >= paipu.events.length - 1){ stop(); return; }
    idx++; render();
  }, Number(document.getElementById("speed").value));
}
document.getElementById("speed").onchange = () => { if (timer){ stop(); play(); } };
document.getElementById("viewpoint").onchange = render;
document.getElementById("scrub").oninput = e => { idx = Number(e.target.value); render(); };
document.getElementById("btn-first").onclick = () => { stop(); idx = 0; render(); };
document.getElementById("btn-last").onclick = () => { stop(); idx = paipu ? paipu.events.length - 1 : 0; render(); };
document.getElementById("btn-prev").onclick = () => { stop(); idx = Math.max(0, idx - 1); render(); };
document.getElementById("btn-next").onclick = () => { stop(); idx = paipu ? Math.min(paipu.events.length - 1, idx + 1) : 0; render(); };
document.getElementById("btn-play").onclick = play;
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowLeft") document.getElementById("btn-prev").click();
  if (e.key === "ArrowRight") document.getElementById("btn-next").click();
  if (e.key === " "){ e.preventDefault(); play(); }
});
const fileInput = document.getElementById("file");
document.getElementById("btn-file").onclick = () => fileInput.click();
fileInput.onchange = () => { if (fileInput.files[0]) readFile(fileInput.files[0]); };
function readFile(f){
  const r = new FileReader();
  r.onload = () => { try { loadText(String(r.result)); } catch(e){ showErr(e); } };
  r.readAsText(f);
}
function showErr(e){ const el = document.getElementById("err"); document.getElementById("loader").classList.add("open"); el.textContent = "読み込みエラー: " + e.message; }
document.getElementById("btn-paste").onclick = () => document.getElementById("loader").classList.toggle("open");
document.getElementById("btn-load-paste").onclick = () => {
  try { document.getElementById("err").textContent = ""; loadText(document.getElementById("paste").value); }
  catch(e){ showErr(e); }
};
const drop = document.getElementById("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); };
document.getElementById("btn-sample").onclick = async () => {
  try { const res = await fetch("sample/sample-paipu.ndjson"); if (!res.ok) throw new Error("サンプルが見つかりません"); loadText(await res.text()); }
  catch(e){ showErr(e); }
};
document.getElementById("btn-webgpu").onclick = () => {
  if (paipu && paipu.events[idx]) {
    try { localStorage.setItem("paipu-webgpu-state", JSON.stringify(paipu.events[idx].state)); } catch(e) {}
  }
  location.href = "proto-webgpu/";
};
render();
</script>
